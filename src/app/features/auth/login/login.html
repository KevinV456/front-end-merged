<div class="pantalla">
  <div class="card tarjeta shadow-lg border-0">
    <div class="card-body p-4 p-md-5">
      <div class="text-center mb-4">
        <span class="logo mb-3">⚽</span>
        <h1 class="h4 fw-bold mb-0">Team Soccer</h1>
        <small class="text-muted">Academia de Fútbol · Acceso al sistema</small>
      </div>

      <form [formGroup]="form" (ngSubmit)="entrar()" novalidate>
        <div class="mb-3">
          <label class="form-label">Usuario</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-person"></i></span>
            <input
              type="text"
              class="form-control"
              formControlName="username"
              [class.is-invalid]="form.controls.username.touched && form.controls.username.invalid"
              placeholder="Ingresa tu usuario"
            />
          </div>
          @if (form.controls.username.touched && form.controls.username.invalid) {
            <div class="text-danger small mt-1">El usuario es obligatorio</div>
          }
        </div>

        <div class="mb-3">
          <label class="form-label">Contraseña</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-lock"></i></span>
            <input
              type="password"
              class="form-control"
              formControlName="password"
              [class.is-invalid]="form.controls.password.touched && form.controls.password.invalid"
              placeholder="Ingresa tu contraseña"
            />
          </div>
          @if (form.controls.password.touched && form.controls.password.invalid) {
            <div class="text-danger small mt-1">La contraseña es obligatoria</div>
          }
        </div>

        @if (error()) {
          <div class="alert alert-danger py-2" role="alert">{{ error() }}</div>
        }

        <button type="submit" class="btn btn-primary w-100 py-2" [disabled]="cargando()">
          @if (cargando()) {
            <span class="spinner-border spinner-border-sm me-2"></span>Ingresando...
          } @else {
            Iniciar sesión
          }
        </button>
      </form>
    </div>
  </div>
</div>
